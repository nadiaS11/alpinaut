<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Alpinaut — Astro + Alpine. Zero React.">
  <defs>
    <!-- Same vertical gradient as the squircle icon, scaled up -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151f"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle starfield (hand-placed; tiny SVG, big visual payoff) -->
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="90"   cy="80"  r="1.4"/>
    <circle cx="220"  cy="140" r="1"/>
    <circle cx="380"  cy="60"  r="1.6"/>
    <circle cx="540"  cy="110" r="1"/>
    <circle cx="700"  cy="70"  r="1.2"/>
    <circle cx="860"  cy="150" r="1"/>
    <circle cx="980"  cy="90"  r="1.5"/>
    <circle cx="1120" cy="130" r="1"/>
    <circle cx="160"  cy="500" r="1.2"/>
    <circle cx="290"  cy="560" r="1"/>
    <circle cx="450"  cy="540" r="1.4"/>
    <circle cx="620"  cy="580" r="1"/>
    <circle cx="790"  cy="520" r="1.2"/>
    <circle cx="950"  cy="560" r="1"/>
    <circle cx="1080" cy="530" r="1.4"/>
  </g>
  <g fill="#a5b4fc" fill-opacity="0.8">
    <circle cx="340"  cy="180" r="1.2"/>
    <circle cx="770"  cy="200" r="1"/>
    <circle cx="1060" cy="240" r="1.4"/>
  </g>

  <!-- Brand mark, scaled from the 512 icon master and centered horizontally -->
  <g transform="translate(458 88) scale(0.55)">
    <!-- orbit -->
    <ellipse cx="256" cy="206" rx="140" ry="44" fill="none"
             stroke="#4fd1c5" stroke-opacity="0.7" stroke-width="7"
             transform="rotate(-18 256 206)"/>
    <!-- peak -->
    <path d="M176 346 L256 206 L336 346" fill="none" stroke="#f5f5f4"
          stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- orbiting body -->
    <circle cx="382" cy="185" r="15" fill="#4fd1c5"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="490"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="120" font-weight="700" letter-spacing="-3" fill="#f5f5f4">
    alpinaut<tspan fill="#4fd1c5">.</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="552"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="500" letter-spacing="0.2" fill="#cbd5e1">
    Astro + Alpine. Zero React.
  </text>

  <!-- Micro-line at the bottom -->
  <text x="600" y="598"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" font-weight="500" letter-spacing="4" fill="#4fd1c5" fill-opacity="0.85">
    WEEKLY NEWSLETTER · EVERY WEDNESDAY
  </text>
</svg>
